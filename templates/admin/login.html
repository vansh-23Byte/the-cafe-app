<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff sign in — {{ cafe.name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Staff sign in</h1>
    <p class="muted small" style="margin-top:0">The dashboard for {{ cafe.name }}.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, text in messages %}
        <div class="flash {{ 'warn' if category == 'warn' }}">{{ text }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>

    <p class="hint">First run: <strong>admin</strong> / <strong>cafe123</strong>. Change it from the
      dashboard before putting this online.</p>
    <p class="small"><a href="{{ url_for('home') }}">Back to the website</a></p>
  </div>
</body>
</html>
